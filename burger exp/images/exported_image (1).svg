<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 深藍夜空 -->
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1a3a"/>
      <stop offset="70%" stop-color="#12284e"/>
      <stop offset="100%" stop-color="#1b3462"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#nightSky)"/>

  <!-- 星星 -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="90" cy="120" r="1.2"/>
    <circle cx="180" cy="80" r="1"/>
    <circle cx="260" cy="160" r="1.4"/>
    <circle cx="340" cy="70" r="1"/>
    <circle cx="420" cy="130" r="1.2"/>
    <circle cx="620" cy="90" r="1.4"/>
    <circle cx="700" cy="170" r="1"/>
    <circle cx="780" cy="60" r="1.2"/>
    <circle cx="860" cy="140" r="1"/>
    <circle cx="920" cy="200" r="1.3"/>
    <circle cx="120" cy="230" r="1"/>
    <circle cx="300" cy="260" r="1.2"/>
    <circle cx="500" cy="210" r="1"/>
    <circle cx="680" cy="240" r="1.1"/>
    <circle cx="820" cy="280" r="1"/>
  </g>

  <!-- 艾菲爾鐵塔剪影 -->
  <path d="M500 820 L420 820 L440 660 L400 460 L470 460 L470 330 L430 330 L480 130 L500 130 L520 130 L570 330 L530 330 L530 460 L600 460 L560 660 L580 820 L500 820 Z
           M445 630 L555 630 M425 510 L575 510 M460 390 L540 390"
        fill="#0b1220" opacity="0.95"/>

  <!-- 塔底微弱反光 -->
  <ellipse cx="500" cy="830" rx="110" ry="10" fill="#ffffff" opacity="0.08"/>

  <!-- 地面 -->
  <rect x="0" y="820" width="100%" height="180" fill="#0f1a30"/>
</svg>
